<!doctype html><html lang="en"><meta charset="utf-8"><title>Flat file selection</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/plugin.css">
<style>*{box-sizing:border-box}body{color:var(--text-normal);--pg-text:var(--personal-text);--pg-muted:var(--personal-muted);margin:0;padding:28px;background:var(--personal-base);--text-normal:#252b25;--text-muted:#596356;--background-modifier-hover:#e8ebe4}.theme-dark{--text-normal:#e8ede5;--text-muted:#b7c0b2;--background-modifier-hover:#333a31;--pg-selection-text:#ffffff}h2{font:650 21px system-ui;margin:0 0 28px}.pg-file{padding:20px;margin:8px 0 16px;gap:12px;cursor:pointer}.pg-file-title{font:650 19px system-ui}.pg-file-preview{font:15px/1.6 system-ui}.pg-file-path{font:12px system-ui}.pg-file-content{gap:8px}small{display:block;color:var(--text-muted);font:13px system-ui;margin:26px 0 12px}.swatches{display:flex;gap:12px}.swatches span{width:32px;height:32px;border-radius:50%;background:var(--pg-selection-start)}.swatches span:last-child{background:var(--pg-selection-end)}</style>
<body><script>document.body.className=new URLSearchParams(location.search).get('mode')==='dark'?'theme-dark':'theme-light';</script>
<h2>Your space</h2><small>Today</small>
<button class="pg-file" aria-current="page"><span class="pg-file-content"><span class="pg-file-title">Personal Glass</span><span class="pg-file-preview">A quiet space for connected ideas</span><span class="pg-file-path">Design / Appearance</span></span></button>
<small>Previous notes</small>
<button class="pg-file"><span class="pg-file-content"><span class="pg-file-title">Knowledge workflow</span><span class="pg-file-preview">Turning information into insight</span><span class="pg-file-path">Design / Workflow</span></span></button>
<button class="pg-file"><span class="pg-file-content"><span class="pg-file-title">Research notes</span><span class="pg-file-preview">Questions, discoveries and ideas</span><span class="pg-file-path">Research / Notes</span></span></button>
<div class="swatches" aria-label="Selection gradient colors"><span></span><span></span></div>
<script>document.querySelectorAll('.pg-file').forEach(button=>button.onclick=()=>{document.querySelector('[aria-current]')?.removeAttribute('aria-current');button.setAttribute('aria-current','page')})</script>
</body></html>
