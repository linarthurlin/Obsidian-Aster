<svg xmlns="http://www.w3.org/2000/svg" width="980" height="538" viewBox="0 0 980 538" role="img" aria-labelledby="title desc"><title id="title">Engineering feedback loop</title><desc id="desc">A simple closed-loop sequence with explicit stages.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b6cc9e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="980" height="538" rx="24" fill="#20231f"/><g font-family="Segoe UI, Microsoft JhengHei, Noto Sans CJK TC, sans-serif"><text x="50" y="62" font-size="26" font-weight="650" fill="#e8eedf">Engineering feedback loop</text><text x="50" y="92" font-size="14" fill="#b7c3aa">A simple closed-loop sequence with explicit stages.</text><path d="M310 199H350" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 199H660" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 274V334" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 419H630" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 419H320" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="50" y="124" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="74" y="164">Sense</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="74" y="204">Collect measurements.</tspan></text></g><g><rect x="360" y="124" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="384" y="164">Estimate</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="384" y="204">Infer the current state</tspan><tspan x="384" y="224">.</tspan></text></g><g><rect x="670" y="124" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="694" y="164">Plan</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="694" y="204">Choose a feasible</tspan><tspan x="694" y="224">action.</tspan></text></g><g><rect x="670" y="344" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="694" y="384">Control</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="694" y="424">Track the target.</tspan></text></g><g><rect x="360" y="344" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="384" y="384">Actuate</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="384" y="424">Apply physical input.</tspan></text></g><g><rect x="50" y="344" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="74" y="384">Evaluate</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="74" y="424">Review error and</tspan><tspan x="74" y="444">constraints.</tspan></text></g></g></svg>
