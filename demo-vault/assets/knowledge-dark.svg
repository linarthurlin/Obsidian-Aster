<svg xmlns="http://www.w3.org/2000/svg" width="980" height="334" viewBox="0 0 980 334" role="img" aria-labelledby="title desc"><title id="title">Knowledge that compounds</title><desc id="desc">Preserve evidence. Connect understanding. Review changes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b6cc9e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="980" height="334" rx="24" fill="#20231f"/><g font-family="Segoe UI, Microsoft JhengHei, Noto Sans CJK TC, sans-serif"><text x="50" y="62" font-size="26" font-weight="650" fill="#e8eedf">Knowledge that compounds</text><text x="50" y="92" font-size="14" fill="#b7c3aa">Preserve evidence. Connect understanding. Review changes.</text><path d="M310 207H350" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 207H660" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="50" y="124" width="260" height="166" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="74" y="164">Capture evidence</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="74" y="204">Keep the original</tspan><tspan x="74" y="224">source and its exact</tspan><tspan x="74" y="244">location.</tspan></text></g><g><rect x="360" y="124" width="260" height="166" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="384" y="164">Connect</tspan><tspan x="384" y="190">understanding</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="384" y="230">Search existing notes</tspan><tspan x="384" y="250">before proposing an</tspan><tspan x="384" y="270">update.</tspan></text></g><g><rect x="670" y="124" width="260" height="166" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="694" y="164">Review and create</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="694" y="204">Check the diff and</tspan><tspan x="694" y="224">sources, then keep the</tspan><tspan x="694" y="244">useful result.</tspan></text></g></g></svg>
