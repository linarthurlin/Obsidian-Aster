<svg xmlns="http://www.w3.org/2000/svg" width="980" height="318" viewBox="0 0 980 318" role="img" aria-labelledby="title desc"><title id="title">從研究到理解</title><desc id="desc">讓資料、推理與確認保持清楚的界線。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b6cc9e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="980" height="318" rx="24" fill="#20231f"/><g font-family="Segoe UI, Microsoft JhengHei, Noto Sans CJK TC, sans-serif"><text x="50" y="62" font-size="26" font-weight="650" fill="#e8eedf">從研究到理解</text><text x="50" y="92" font-size="14" fill="#b7c3aa">讓資料、推理與確認保持清楚的界線。</text><path d="M310 199H350" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 199H660" fill="none" stroke="#b6cc9e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="50" y="124" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="74" y="164">閱讀原始資料</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="74" y="204">保留來源、條件與公式。</tspan></text></g><g><rect x="360" y="124" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="384" y="164">比較與連結</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="384" y="204">找出相同概念、差異與矛盾。</tspan></text></g><g><rect x="670" y="124" width="260" height="150" rx="18" fill="#2c3228" stroke="#637454"/><text font-size="20" font-weight="600" fill="#e8eedf"><tspan x="694" y="164">確認新的理解</tspan></text><text font-size="15" fill="#b7c3aa"><tspan x="694" y="204">檢查證據，再更新既有筆記。</tspan></text></g></g></svg>
