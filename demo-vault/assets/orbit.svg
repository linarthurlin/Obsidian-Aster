<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">A thought becomes connected knowledge</title>
  <desc id="desc">Three rounded cards connect capture, understand and create.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8ecdf"/><stop offset="1" stop-color="#eee1d5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#637153" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="360" rx="24" fill="url(#bg)"/>
  <g fill="#fffdf7" stroke="#bdc5af" stroke-width="1.5">
    <rect x="50" y="100" width="230" height="150" rx="20"/>
    <rect x="365" y="100" width="230" height="150" rx="20"/>
    <rect x="680" y="100" width="230" height="150" rx="20"/>
  </g>
  <g stroke="#637153" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M296 175H347"/><path d="M611 175H662"/></g>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#303b29">
    <g font-size="26" font-weight="600"><text x="165" y="165">Capture</text><text x="480" y="165">Understand</text><text x="795" y="165">Create</text></g>
    <g font-size="16" fill="#647058"><text x="165" y="198">Keep the original</text><text x="480" y="198">Find the connections</text><text x="795" y="198">Make something useful</text></g>
  </g>
</svg>
